name: Deploy staging to Cloudflare

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  STAGING_CONFIG: .wrangler.staging.generated.jsonc
  STAGING_DEPLOY_CONFIG: dist/konogoro_staging/wrangler.json
  D1_DATABASE_NAME: family-timeline-staging
  R2_BUCKET_NAME: family-timeline-media-staging
  STAGING_ORIGIN: https://konogoro-staging.tsito-apps.workers.dev

jobs:
  deploy:
    name: Provision, check, migrate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      - name: Run checks
        run: npm run check

      - name: Ensure staging resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          d1_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == env.D1_DATABASE_NAME) | (.uuid // .database_id)' | head -n 1)"
          if [[ -z "$d1_id" ]]; then
            npx wrangler d1 create "$D1_DATABASE_NAME"
            d1_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == env.D1_DATABASE_NAME) | (.uuid // .database_id)' | head -n 1)"
          fi
          if [[ -z "$d1_id" ]]; then
            echo "::error::Could not resolve the staging D1 database ID."
            exit 1
          fi

          if ! r2_output="$(npx wrangler r2 bucket create "$R2_BUCKET_NAME" 2>&1)"; then
            if grep -Fq "already exists, and you own it" <<<"$r2_output"; then
              echo "::notice::Staging R2 bucket already exists."
            else
              printf '%s\n' "$r2_output"
              exit 1
            fi
          else
            printf '%s\n' "$r2_output"
          fi

          sed \
            -e "s/__STAGING_D1_DATABASE_ID__/$d1_id/" \
            -e "s/__CLOUDFLARE_ACCOUNT_ID__/$CLOUDFLARE_ACCOUNT_ID/" \
            wrangler.staging.jsonc > "$STAGING_CONFIG"

      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config "$STAGING_CONFIG"

      - name: Build staging deployment
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ${{ env.STAGING_CONFIG }}
        run: npm run build

      - name: Configure staging R2 CORS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket cors set "$R2_BUCKET_NAME" --file r2-cors.staging.json --force

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config "$STAGING_DEPLOY_CONFIG"

      - name: Configure optional staging uploads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$STAGING_R2_ACCESS_KEY_ID" && -n "$STAGING_R2_SECRET_ACCESS_KEY" ]]; then
            printf '%s' "$STAGING_R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID --config "$STAGING_DEPLOY_CONFIG"
            printf '%s' "$STAGING_R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY --config "$STAGING_DEPLOY_CONFIG"
          else
            echo "::notice::Staging upload credentials are not configured; upload checks remain disabled."
          fi

      - name: Verify staging deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deployments status --json --config "$STAGING_DEPLOY_CONFIG"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSI "$STAGING_ORIGIN/"
