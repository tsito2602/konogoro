<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" data-theme-color="light" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" data-theme-color="dark" />
    <meta name="description" content="家族だけの写真と動画のタイムライン" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        const theme = localStorage.getItem("konogoro-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
      if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true)
        document.documentElement.classList.add("standalone");
    </script>
    <style>
      body {
        margin: 0;
      }
      .boot-screen {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        color: #000;
        background: #fff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Hiragino Sans",
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic UI",
          Meiryo,
          sans-serif;
      }
      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #initial-boot[hidden] {
        display: none;
      }
      .boot-symbol {
        display: none;
        width: 152px;
        height: 152px;
        margin-bottom: -12px;
      }
      .boot-symbol svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .standalone .boot-symbol-animated {
        display: block;
      }
      .boot-symbol-animated .ink {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform, opacity;
        animation-duration: 900ms;
        animation-fill-mode: both;
        animation-timing-function: cubic-bezier(0.33, 0, 0.2, 1);
      }
      .boot-symbol-animated .boot-sky {
        transform-box: view-box;
        transform-origin: 50% 70%;
        animation-name: boot-sky;
      }
      .boot-symbol-animated .boot-sun {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 1);
        animation-name: boot-sun;
      }
      .boot-symbol-animated .boot-mountain {
        animation-name: boot-mountain;
      }
      @keyframes boot-sun {
        0% {
          transform: translate3d(0, 100px, 0) scale(0.68);
          opacity: 0;
        }
        66% {
          transform: translate3d(0, -18px, 0) scale(1.015);
          opacity: 1;
        }
        86% {
          transform: translate3d(0, 3px, 0) scale(0.998);
          opacity: 1;
        }
        100% {
          transform: translate3d(0, 0, 0) scale(1);
          opacity: 1;
        }
      }
      @keyframes boot-sky {
        from {
          transform: rotate(-8deg);
        }
        to {
          transform: rotate(0deg);
        }
      }
      @keyframes boot-mountain {
        from {
          transform: translate3d(0, 6px, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-symbol-animated .ink {
          animation: none;
        }
      }
      .boot-name {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      .boot-status {
        margin: 8px 0 0;
        color: #77726b;
        font-size: 14px;
      }
      .standalone .boot-status {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) .boot-screen {
          color: #f5f1e9;
          background: #141312;
        }
        :root:not([data-theme]) .boot-status {
          color: #aaa49b;
        }
      }
      :root[data-theme="dark"] .boot-screen {
        color: #f5f1e9;
        background: #141312;
      }
      :root[data-theme="dark"] .boot-status {
        color: #aaa49b;
      }
    </style>
    <script>
      const localDevelopment = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (!localDevelopment && "serviceWorker" in navigator) {
        let reloadingForServiceWorker = false;
        let pendingServiceWorkerReload = false;
        const applyServiceWorkerUpdate = () => {
          if (document.documentElement.dataset.unsavedChanges === "true") {
            pendingServiceWorkerReload = true;
            return;
          }
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          location.reload();
        };
        navigator.serviceWorker.addEventListener("controllerchange", applyServiceWorkerUpdate);
        window.addEventListener("konogoro-draft-settled", () => {
          if (pendingServiceWorkerReload) applyServiceWorkerUpdate();
        });
        navigator.serviceWorker
          .register("/service-worker.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(() => {});
      }
    </script>
    <title>このごろ</title>
  </head>
  <body>
    <script>
      performance.mark("konogoro-boot");
    </script>
    <main id="initial-boot" class="boot-screen" role="status" aria-label="このごろを読み込み中">
      <div class="boot-brand">
        <!-- Keep this initial artwork in sync with assets/brand/symbol.svg. -->
        <span class="boot-symbol boot-symbol-animated" aria-hidden="true"
          ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
            <title id="title">このごろ — 雲と丘</title>
            <desc id="desc">雲、丘、その後ろから昇る太陽で、ひらがなの「こ」を表した白黒のシンボル</desc>
            <defs>
              <mask id="konogoro-sun-gap" maskUnits="userSpaceOnUse" x="-1024" y="-1024" width="3072" height="3072">
                <rect x="-1024" y="-1024" width="3072" height="3072" fill="#FFFFFF" />
                <path
                  d="M105 609 C120 566 164 545 209 573 C305 647 381 653 460 633 C549 611 599 557 660 512 C698 482 720 475 750 490 C805 521 851 581 890 622 C930 670 918 711 877 742 C751 844 531 872 347 815 C212 782 156 733 120 680 C109 662 95 635 105 609 Z"
                  transform="translate(54 88) scale(0.91)"
                  fill="#000000"
                  stroke="#000000"
                  stroke-width="66"
                  stroke-linejoin="round"
                />
              </mask>
            </defs>
            <g transform="translate(512 512) scale(1.053) translate(-520.3 -531)">
              <path
                class="ink boot-sky"
                fill="currentColor"
                d="m683.9 189.4c-38.27 0-74.88 9.216-106 17.79-39.17 11.39-81.54 21.5-123.6 21.5-39.94 0-74.88-11.26-99.71-28.67-16.9-11.65-35.58-18.82-55.55-18.94-45.18 0-83.07 33.54-83.07 74.11 0 48.64 51.97 96.38 139.8 96.38 59.78 0 124.8-19.84 194.2-19.84 58.88 0 113.3 14.34 150.3 36.1 12.54 7.04 26.37 10.37 38.02 10.37 47.1 0 84.48-35.46 84.48-82.3 0-58.88-54.02-106.9-138.8-106.5z"
              />
              <g mask="url(#konogoro-sun-gap)">
                <circle class="ink boot-sun" fill="currentColor" cx="518" cy="649" r="143" />
              </g>
              <g transform="translate(54 88) scale(0.91)">
                <path
                  class="ink boot-mountain"
                  fill="currentColor"
                  d="M105 609 C120 566 164 545 209 573 C305 647 381 653 460 633 C549 611 599 557 660 512 C698 482 720 475 750 490 C805 521 851 581 890 622 C930 670 918 711 877 742 C751 844 531 872 347 815 C212 782 156 733 120 680 C109 662 95 635 105 609 Z"
                />
              </g>
            </g>
          </svg> </span
        ><strong class="boot-name">このごろ</strong>
        <p class="boot-status">読み込み中…</p>
      </div>
    </main>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
