<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" data-theme-color="light" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" data-theme-color="dark" />
    <meta name="description" content="家族だけの写真と動画のタイムライン" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" sizes="any" />
    <meta name="apple-mobile-web-app-title" content="konogoro" />
    <meta name="application-name" content="konogoro" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <script>
      try {
        const theme = localStorage.getItem("konogoro-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
      if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true)
        document.documentElement.classList.add("standalone");
    </script>
    <style>
      body {
        margin: 0;
      }
      /* 起動画面は uchino・kondo・uchiwake と同じ寸法：シンボルの枠 176×142、名前まで 22px、名前の高さ 30px。
         アプリが描けたら src/client/boot-handoff.ts が太陽を墨の玉にしてドックへ落とす。 */
      .boot-screen {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        color: #000;
        background: #fff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Hiragino Sans",
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic UI",
          Meiryo,
          sans-serif;
      }
      .boot-brand {
        display: grid;
        justify-items: center;
        gap: 22px;
        text-align: center;
      }
      #initial-boot[hidden] {
        display: none;
      }
      .boot-symbol {
        display: none;
        width: 176px;
        height: 142px;
      }
      .boot-symbol svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .standalone .boot-symbol-animated {
        display: block;
      }
      .boot-symbol-animated :is(.boot-cloud, .boot-cloud-bob, .boot-sun, .boot-hill, .boot-hill-gap) {
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      .boot-symbol-animated .boot-cloud {
        transform-origin: 50% 50%;
      }
      /* 名前は kondo の文字グリッド（1字 74×102、線 18、丸い線端）で描く。r は n を書く途中で止めた形。 */
      .boot-name {
        display: flex;
        gap: 0.075em;
        height: 1em;
        font-size: 30px;
        line-height: 1;
      }
      .boot-name span {
        display: block;
        width: 0.725em;
        height: 1em;
        transform-origin: 50% 100%;
      }
      .boot-name span.boot-letter-narrow {
        width: 0.62em;
      }
      .boot-name svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke: currentColor;
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* 雲がふわっと降りて浮かび、山が地面から盛り上がり、太陽が山の後ろから弾んで昇って光の線が出る。
         最後に名前が1字ずつ弾む。全体で約1.6秒。数値を変えるときは src/client/boot-motion.ts の長さも合わせる。 */
      .standalone .boot-symbol-animated .boot-cloud {
        animation: boot-cloud 900ms linear both;
      }
      .standalone .boot-symbol-animated .boot-cloud-bob {
        animation: boot-cloud-bob 1800ms ease-in-out 900ms infinite;
      }
      .standalone .boot-symbol-animated :is(.boot-hill, .boot-hill-gap) {
        animation: boot-hill 712.5ms linear 150ms both;
      }
      .standalone .boot-symbol-animated .boot-sun {
        animation: boot-sun 675ms linear 645ms both;
      }
      .standalone .boot-symbol-animated .boot-rays path {
        animation: boot-ray 390ms cubic-bezier(0.2, 0.6, 0.4, 1) 1009.5ms both;
      }
      .standalone .boot-symbol-animated .boot-rays path:is(:nth-child(2), :nth-child(4)) {
        animation-delay: 1047ms;
      }
      .standalone .boot-symbol-animated .boot-rays path:is(:nth-child(1), :nth-child(5)) {
        animation-delay: 1084.5ms;
      }
      .standalone .boot-name span {
        animation: boot-letter 285ms linear both;
      }
      .standalone .boot-name span:nth-child(1) {
        animation-delay: 1020ms;
      }
      .standalone .boot-name span:nth-child(2) {
        animation-delay: 1061.25ms;
      }
      .standalone .boot-name span:nth-child(3) {
        animation-delay: 1102.5ms;
      }
      .standalone .boot-name span:nth-child(4) {
        animation-delay: 1143.75ms;
      }
      .standalone .boot-name span:nth-child(5) {
        animation-delay: 1185ms;
      }
      .standalone .boot-name span:nth-child(6) {
        animation-delay: 1226.25ms;
      }
      .standalone .boot-name span:nth-child(7) {
        animation-delay: 1267.5ms;
      }
      .standalone .boot-name span:nth-child(8) {
        animation-delay: 1308.75ms;
      }
      @keyframes boot-cloud {
        0% {
          transform: translate(0, -266.66px);
          opacity: 0;
          animation-timing-function: cubic-bezier(0.25, 0.6, 0.35, 1);
        }
        20% {
          transform: none;
          opacity: 1;
        }
        60% {
          transform: translate(0, 8.57px) scale(1.024, 0.97);
          animation-timing-function: ease-in-out;
        }
        80% {
          transform: translate(0, -8.57px) scale(0.994, 1.012);
          animation-timing-function: ease-in-out;
        }
        100% {
          transform: none;
        }
      }
      @keyframes boot-cloud-bob {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: translate(0, -11.9px);
        }
      }
      @keyframes boot-hill {
        0% {
          transform: translate(0, 397.68px) scale(1.03, 0.94);
          animation-timing-function: cubic-bezier(0.4, 0.15, 0.35, 1);
        }
        80% {
          transform: translate(0, -4.71px) scale(0.994, 1.012);
          animation-timing-function: ease-in-out;
        }
        100% {
          transform: none;
        }
      }
      @keyframes boot-sun {
        0% {
          transform: translate(0, 190.47px);
          opacity: 0;
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        4% {
          transform: translate(0, 185.71px);
          opacity: 1;
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        36% {
          transform: translate(0, -51.43px) scale(0.958, 1.054);
          animation-timing-function: cubic-bezier(0.5, 0, 0.8, 0.4);
        }
        54% {
          transform: scale(1.06, 0.94);
          animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1);
        }
        68% {
          transform: translate(0, -17.14px) scale(0.988, 1.012);
          animation-timing-function: cubic-bezier(0.5, 0, 0.8, 0.4);
        }
        80% {
          transform: scale(1.018, 0.982);
        }
        100% {
          transform: none;
        }
      }
      @keyframes boot-ray {
        from {
          stroke-dashoffset: 0.5;
        }
        to {
          stroke-dashoffset: -1.1;
        }
      }
      @keyframes boot-letter {
        0% {
          transform: translateY(10px);
          opacity: 0;
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        50% {
          transform: translateY(-2.4px) scale(0.976, 1.036);
          opacity: 1;
          animation-timing-function: cubic-bezier(0.5, 0, 0.8, 0.4);
        }
        75% {
          transform: scale(1.024, 0.976);
        }
        100% {
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen * {
          animation: none !important;
        }
      }
      .boot-status {
        margin: -8px 0 0;
        color: #77726b;
        font-size: 14px;
      }
      .standalone .boot-status {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) .boot-screen {
          color: #f5f1e9;
          background: #141312;
        }
        :root:not([data-theme]) .boot-status {
          color: #aaa49b;
        }
      }
      :root[data-theme="dark"] .boot-screen {
        color: #f5f1e9;
        background: #141312;
      }
      :root[data-theme="dark"] .boot-status {
        color: #aaa49b;
      }
    </style>
    <script>
      const localDevelopment = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (!localDevelopment && "serviceWorker" in navigator) {
        let reloadingForServiceWorker = false;
        let pendingServiceWorkerReload = false;
        const applyServiceWorkerUpdate = () => {
          if (document.documentElement.dataset.unsavedChanges === "true") {
            pendingServiceWorkerReload = true;
            return;
          }
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          location.reload();
        };
        navigator.serviceWorker.addEventListener("controllerchange", applyServiceWorkerUpdate);
        window.addEventListener("konogoro-draft-settled", () => {
          if (pendingServiceWorkerReload) applyServiceWorkerUpdate();
        });
        navigator.serviceWorker
          .register("/service-worker.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(() => {});
      }
    </script>
    <title>konogoro</title>
  </head>
  <body>
    <script>
      performance.mark("konogoro-boot");
    </script>

                  />
                </g>

            </g></svg
        ></span>
        <strong class="boot-name" aria-label="konogoro">
          <span
            ><svg viewBox="0 0 74 102"><path d="M12 12V90M58 38L12 70M29 59L60 90" /></svg

          <span

          <span

              <circle cx="37" cy="64" r="26" />

        </strong>
        <p class="boot-status">読み込み中…</p>
      </div>
    </main>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
