<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" data-theme-color="light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" data-theme-color="dark" />
    <meta name="description" content="家族だけの写真と動画のタイムライン" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        const theme = localStorage.getItem("konogoro-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script>
      const localDevelopment = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (!localDevelopment && "serviceWorker" in navigator) {
        let reloadingForServiceWorker = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          location.reload();
        });
        navigator.serviceWorker.register("/service-worker.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(() => {});
      }
    </script>
    <title>このごろ</title>
  </head>
  <body>
    <div id="root"><main style="min-height:100vh;display:grid;place-items:center;color:CanvasText;background:Canvas;font-family:system-ui,-apple-system,sans-serif"><div style="text-align:center"><strong>このごろ</strong><p style="margin:8px 0 0;color:GrayText;font-size:14px">読み込み中…</p></div></main></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
