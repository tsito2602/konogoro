<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" data-theme-color="light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" data-theme-color="dark" />
    <meta name="description" content="家族だけの写真と動画のタイムライン" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        const theme = localStorage.getItem("konogoro-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
      if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) document.documentElement.classList.add("standalone");
    </script>
    <style>
      body { margin: 0; }
      .boot-screen { min-height: 100dvh; display: grid; place-items: center; color: #1d1d1f; background: #f5f5f7; font-family: system-ui, -apple-system, sans-serif; }
      .boot-brand { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .boot-symbol { display: none; width: 152px; height: 152px; margin-bottom: -12px; }
      .boot-symbol-dark { display: none; }
      .boot-name { font-size: 20px; font-weight: 650; letter-spacing: .04em; }
      .boot-status { margin: 8px 0 0; color: #707070; font-size: 14px; }
      .standalone .boot-symbol-light { display: block; }
      .standalone .boot-status { display: none; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) .boot-screen { color: #f5f5f7; background: #000; }
        :root:not([data-theme]) .boot-symbol-light { display: none; }
        :root:not([data-theme]).standalone .boot-symbol-dark { display: block; }
        :root:not([data-theme]) .boot-status { color: #aeaeb2; }
      }
      :root[data-theme="dark"] .boot-screen { color: #f5f5f7; background: #000; }
      :root[data-theme="dark"] .boot-symbol-light { display: none; }
      :root[data-theme="dark"].standalone .boot-symbol-dark { display: block; }
      :root[data-theme="dark"] .boot-status { color: #aeaeb2; }
    </style>
    <script>
      const localDevelopment = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (!localDevelopment && "serviceWorker" in navigator) {
        let reloadingForServiceWorker = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          location.reload();
        });
        navigator.serviceWorker.register("/service-worker.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(() => {});
      }
    </script>
    <title>このごろ</title>
  </head>
  <body>
    <div id="root"><main class="boot-screen"><div class="boot-brand"><img class="boot-symbol boot-symbol-light" src="/icons/icon-light-transparent.png" alt=""><img class="boot-symbol boot-symbol-dark" src="/icons/icon-dark-transparent.png" alt=""><strong class="boot-name">このごろ</strong><p class="boot-status">読み込み中…</p></div></main></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
